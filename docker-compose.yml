services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: carrier
      POSTGRES_PASSWORD: carrier
      POSTGRES_DB: carrier_sales
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carrier"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://carrier:carrier@postgres:5432/carrier_sales
      API_KEY: dev-api-key
      CORS_ORIGINS: '["http://localhost:3000","http://localhost:5173"]'
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  dashboard:
    build:
      context: ./dashboard
      args:
        VITE_API_URL: http://localhost:8000
        VITE_API_KEY: dev-api-key
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pg-data:
